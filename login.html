<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login/signUp</title>


    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Quicksand:wght@300..700&family=Raleway:ital,wght@0,100..900;1,100..900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">

    <link href="./src/output.css" rel="stylesheet">

</head>

<body>
    <main class="hidden md:block">
        <div class="relative w-full min-h-screen overflow-hidden">


            <div
                class="absolute inset-0 w-full max-w-7xl h-244.25 mx-auto opacity-40 bg-[radial-gradient(circle,rgba(216,227,251,1)_0%,rgba(216,227,251,0)_100%)]">
            </div>


            <div class="absolute -top-20 -left-20 w-96 h-96 rounded-full bg-bg-button/5 blur-3xl"></div>


            <div class="absolute -bottom-20 -right-20 w-96 h-96 rounded-full bg-bg-button/5 blur-3xl"></div>


            <div class="relative z-10 container row justify-center w-full py-10">
                <div class="card gap-10 p-12  w-full max-w-120 shadow-[0_20px_25px_-5px_rgba(15,23,42,0.12)]">

                    <div class="col text-center items-center mb-10 mt-10">
                        <img src="./src/imgs/logo.svg" alt="TechNest logo" class="w-fit h-fit">
                        <h1 class="font-semibold lg:text-[32px] leading-[31.2px] lg:leading-[38.4px] text-tx-color">
                            TechNest</h1>
                        <p class="text-p-color font-normal text-base leading-6 pt-2">Access your professional
                            workstation</p>
                    </div>

                    <form class="w-full">

                        <div class="w-full gap-6">
                            <label class="block mb-[9.5px] span-proprites">Email Address</label>
                            <div class="relative">
                                <img src="./src/imgs/email-icon.svg" class="absolute left-3 top-2.5">
                                <input type="email" name="email" id="useremail" placeholder="name@company.com"
                                    class="input input-focus font-normal text-base leading-4 w-full  text-[#6B7280] py-3.5  pr-6 pl-10">
                            </div>
                        </div>

                        <div class="form-group w-full">
                            <div class="flex items-center justify-between w-full mb-2 mt-6">
                                <label class="block span-proprites">Password</label>
                                <a href="#"
                                    class="whitespace-nowrap text-base leading-6 font-normal text-bg-button hover:underline">Forgot
                                    password?</a>
                            </div>

                            <div class="relative">
                                <img src="./src/imgs/block-icon.svg" class="absolute left-3 top-2.5">
                                <input type="password" name="password" id="userpassword" placeholder="••••••••"
                                    class=" input input-focus w-full  text-[#6B7280] py-3.5 pr-12 pl-10">
                                <img src="./src/imgs/eyes-icon.svg" alt="Toggle password visibility"
                                    class="absolute right-3 top-[17.25px] cursor-pointer transition-opacity duration-200 hover:opacity-70">
                            </div>
                        </div>

                        <div class="form-options mt-6 mb-8 row">
                            <input type="checkbox" id="remember"
                                class="border-c- bg-[#FFFFFF] w-4 h-4  rounded-sm accent-bg-button">
                            <label for="remember" class="pl-2 span-proprites">Keep me logged in for 30 days</label>
                        </div>

                        <button type="submit"
                            class="row bg-[#FF5A1F] text-[#FFFFFF] font-normal text-base leading-6 rounded-lg py-4  gap-2 justify-center w-full btn-cta hover:bg-[#E64F17]">
                            <span class="font-normal text-base leading-6">Sign In</span>
                            <img src="./src/imgs/arrow-icon.svg" class="w-fit h-fit">
                        </button>

                    </form>


                    <div class="row my-8">
                        <div class="flex-1 border-t border-c-border"></div>
                        <span class="px-4 text-xs font-semibold leading-3 whitespace-nowrap text-[#76777D]">OR CONTINUE
                            WITH</span>
                        <div class="flex-1 border-t border-c-border"></div>
                    </div>


                    <div class=" flex gap-4">
                        <button
                            class="flex-1 w-full border-c  rounded-lg row justify-center gap-3 py-4 px-[47.44px] font-normal text-base  text-tx-color leading-6 transition-all duration-200 hover:bg-[#F9F9FF] hover:border-bg-button">
                            <img src="./src/imgs/google-icon.png" alt="Google" class="w-fit h-fit">
                            Google
                        </button>
                        <button
                            class="flex-1 w-full  border-c rounded-lg row justify-center gap-3 py-3 px-[50.58px] font-normal text-base text-tx-color leading-6 transition-all duration-200 hover:bg-[#F9F9FF] hover:border-bg-button">
                            <img src="./src/imgs/download.svg" alt="Apple" class="w-fit h-fit">
                            Apple
                        </button>
                    </div>

                    <p class="text-center font-normal text-base text-p-color mt-8 leading-6 whitespace-nowrap">
                        Don't have an account?
                        <a href="#" class="text-bg-button text-base leading-6 font-bold hover:underline">Create
                            Account</a>
                    </p>
                </div>
            </div>

        </div>

    </main>


</body>
</html>
