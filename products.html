<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All Products</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Quicksand:wght@300..700&family=Raleway:ital,wght@0,100..900;1,100..900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">


    <link href="./src/output.css" rel="stylesheet">
</head>

<body>
    <header class="sticky top-0 z-50 hidden md:block border-b border-c-border bg-[#F9F9FF]">
        <div class="container row justify-between py-4 px-4 md:px-6 lg:px-0">
            <div class="gap-4 md:gap-6 lg:gap-8 row">
                <div>
                    <a href="./index.html" class="text-xl md:text-2xl font-bold leading-[31.2px]">TechNest</a>
                </div>
                <nav class="hidden lg:block">
                    <ul class="row gap-6">
                        <li>
                             <a href="./index.html" class="nav-link transition-colors duration-200 hover:text-bg-button">Home</a>
                        </li>

                        <li>
                            <a href="./products.html" class="nav-link  text-bg-button border-bg-button ">Products</a>
                        </li>

                        <li>
                            <a href="./contact.html" class="nav-link transition-colors duration-200 hover:text-bg-button">Contact</a>
                        </li>
                    </ul>
                </nav>
            </div>

            <div class="row gap-2 md:gap-3 lg:gap-4">

                <div class="hidden lg:flex row bg-[#F0F3FF] py-2 pr-4 rounded-[9999px] border-c has-focus:border-bg-button transition-colors duration-200">

                    <button type="submit">
                        <img src="./src/imgs/search.svg" alt="search-icon" class="w-fit h-fit">
                    </button>

                    <input type="search" id="search" name="search" placeholder="Search tech..."
                      class="flex-1 pl-2 outline-none">

                </div>



                <ul class="row gap-3 lg:gap-4">

                    <li>
                        <a>
                            <img src="./src/imgs/heart-bl.svg" alt="heart-icon" class="w-fit h-fit hover-grow" />
                        </a>
                    </li>

                    <li>
                        <a class="block">
                            <img src="./src/imgs/cart-bl.svg" alt="cart-icon" class="w-fit h-fit hover-grow" />
                        </a>
                    </li>

                    <li>
                        <a class="hidden md:block">
                            <img src="./src/imgs/product-icon.png"
                                class=" border-c  rounded-[9999px] w-fit h-fit hover-grow " />
                        </a>
                    </li>
                </ul>
            </div>

        </div>
    </header>


    <main class="hidden md:block bg-[#F9F9FF]">
        <section class="py-4 lg:py-6">

            <div class="container row flex-wrap gap-2 justify-between px-4 md:px-6 lg:px-0">

                <nav class="row gap-2">
                    <a class="text-p-color font-medium text-sm leading-[19.6px] hover:text-tx-color transition-colors duration-200">Home</a>
                    <img src="./src/imgs/next-bl.svg" class="w-fit h-fit ">
                    <span class=" font-semibold text-sm leading-[19.6px]">Computers & Tablets</span>


                </nav>

                <div>
                    <p class="font-normal text-sm leading-[19.6px]">Showing <span
                            class="text-black font-normal text-sm leading-[19.6px]">1–24</span> of 156 products</p>
                </div>

            </div>

        </section>



        <section class="py-4 lg:py-6">
            <div class="container px-4 md:px-6 lg:px-0">
                <div class="grid grid-cols-1 lg:grid-cols-[256px_1fr] gap-6">

                    <aside class="col gap-6 lg:w-[256px]">

                        <div class="gap-3">
                            <h3
                                class=" text-tx-color pb-2 border-b border-[#E5E7EB] font-normal text-lg leading-6.75 mb-3">
                                Category</h3>
                            <div class="col gap-2 ">
                              <label class="row gap-2 text-base text-tx-color font-normal leading-6 hover-label">
                                    <input type="checkbox" checked class=" bg-white  border-c rounded-sm"> Laptops &
                                    Notebooks
                                </label>

                              <label class="row gap-2 text-base text-tx-color font-normal leading-6 hover-label">
                                    <input type="checkbox" class=" bg-white  border-c rounded-sm"> Desktops & Towers
                                </label>

                                <label class="row gap-2 text-base text-tx-color font-normal leading-6 hover-label">
                                    <input type="checkbox" class=" bg-white  border-c rounded-sm"> Tablet PC
                                </label>

                               <label class="row gap-2 text-base text-tx-color font-normal leading-6 hover-label">
                                    <input type="checkbox" class=" bg-white  border-c rounded-sm"> Components
                                </label>
                            </div>
                        </div>

                        <div>
                            <h3 class="pb-2 border-b border-[#E5E7EB] font-normal text-lg leading-6.75 mb-6.5">Price
                                Range</h3>

                            <input class="w-full lg:w-[256px] h-1 rounded-lg bg-[#DEE8FF] mb-4">

                            <div class="w-full lg:w-[256px] row justify-between">

                                <div class="w-[66.95px] flex justify-center bg-[#E7EEFF] rounded-sm border-c px-2 py-1">
                                    <span>$100</span>
                                </div>

                                <span class="text-[#76777D] font-medium text-sm leading-[19.6px]">to</span>

                                <div class="w-[66.95px] flex justify-center bg-[#E7EEFF] rounded-sm border-c px-2 py-1">
                                    <span>$5,000 </span>
                                </div>
                            </div>
                        </div>

                        <div class="gap-3">
                            <h3
                                class="text-tx-color pb-2 border-b border-[#E5E7EB] font-normal text-lg leading-6.75 mb-3">
                                Brand</h3>
                            <div class="col gap-2">

                                  <label class="row gap-2 text-base text-tx-color font-normal leading-6 hover-label">
                                    <input type="checkbox"> TechCore
                                </label>

                                 <label class="row gap-2 text-base text-tx-color font-normal leading-6 hover-label">
                                    <input type="checkbox" checked> Nexus Systems
                                </label>

                                <label class="row gap-2 text-base text-tx-color font-normal leading-6 hover-label">
                                    <input type="checkbox"> Peak Dynamics
                                </label>

                                 <label class="row gap-2 text-base text-tx-color font-normal leading-6 hover-label">
                                    <input type="checkbox"> UltraThin
                                </label>
                            </div>
                        </div>

                        <div class="gap-3">
                            <h3
                                class=" text-tx-color pb-2 border-b border-[#E5E7EB] font-normal text-lg leading-6.75 mb-3">
                                Rating</h3>

                            <div class="row gap-1 hover:opacity-70 transition-opacity duration-200">

                                    <img src="./src/imgs/star-r.svg" class="w-fit h-fit" />


                                    <img src="./src/imgs/star-r.svg" class="w-fit h-fit" />

                                    <img src="./src/imgs/star-r.svg" class="w-fit h-fit" />

                                    <img src="./src/imgs/star-r.svg" class="w-fit h-fit" />

                                    <img src="./src/imgs/star-rw.svg" class="w-fit h-fit" />


                                <span class="font-medium text-sm leading-[19.6px] items-center">& Up</span>


                            </div>

                        </div>

                        <div class="gap-3">
                            <h3
                                class=" text-tx-color pb-2 border-b border-[#E5E7EB] font-normal text-lg leading-6.75 mb-3">
                                Finish</h3>
                            <div class="flex gap-2">
                                <span
                                    class="w-6 h-6 rounded-[9999px] bg-[#1E293B] shadow-[0_0_0_2px_#FFFFFF,0_0_0_6px_#0051D5]"></span>
                                <span class="w-6 h-6 rounded-[9999px] bg-[#CBD5E1] transition-transform duration-200 hover:scale-110"></span>
                                <span class="w-6 h-6 rounded-[9999px] bg-[#F8FAFC]  border-c transition-transform duration-200 hover:scale-110"></span>
                                <span class="w-6 h-6 rounded-[9999px] bg-[#475569] transition-transform duration-200 hover:scale-110"></span>
                            </div>
                        </div>

                    </aside>



                </div>
            </div>
        </section>

    </main>


</body>

</html>
