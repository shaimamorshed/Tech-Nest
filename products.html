<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All Products</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Quicksand:wght@300..700&family=Raleway:ital,wght@0,100..900;1,100..900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">


    <link href="./src/output.css" rel="stylesheet">
</head>

<body>
    <header class=" hidden md:block border-b border-c-border bg-[#F9F9FF]">
        <div class="container row justify-between py-4 px-4 md:px-6 lg:px-0">
            <div class="gap-4 md:gap-6 lg:gap-8 row">
                <div>
                    <a href="./index.html" class="text-xl md:text-2xl font-bold leading-[31.2px]">TechNest</a>
                </div>
                <nav class="hidden lg:block">
                    <ul class="row gap-6">
                        <li>
                             <a href="./index.html" class="nav-link transition-colors duration-200 hover:text-bg-button">Home</a>
                        </li>

                        <li>
                            <a href="./products.html" class="nav-link  text-bg-button border-bg-button ">Products</a>
                        </li>

                        <li>
                            <a href="./contact.html" class="nav-link transition-colors duration-200 hover:text-bg-button">Contact</a>
                        </li>
                    </ul>
                </nav>
            </div>

            <div class="row gap-2 md:gap-3 lg:gap-4">

                <div class="hidden lg:flex row bg-[#F0F3FF] py-2 pr-4 rounded-[9999px] border-c has-focus:border-bg-button transition-colors duration-200">

                    <button type="submit">
                        <img src="./src/imgs/search.svg" alt="search-icon" class="w-fit h-fit">
                    </button>

                    <input type="search" id="search" name="search" placeholder="Search tech..."
                      class="flex-1 pl-2 outline-none">

                </div>



                <ul class="row gap-3 lg:gap-4">

                    <li>
                        <a>
                            <img src="./src/imgs/heart-bl.svg" alt="heart-icon" class="w-fit h-fit hover-grow" />
                        </a>
                    </li>

                    <li>
                        <a class="block">
                            <img src="./src/imgs/cart-bl.svg" alt="cart-icon" class="w-fit h-fit hover-grow" />
                        </a>
                    </li>

                    <li>
                        <a class="hidden md:block">
                            <img src="./src/imgs/product-icon.png"
                                class=" border-c  rounded-[9999px] w-fit h-fit hover-grow " />
                        </a>
                    </li>
                </ul>
            </div>

        </div>
    </header>


</body>

</html>
